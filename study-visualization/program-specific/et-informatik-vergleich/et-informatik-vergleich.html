            const bg = getColor(m.cat, colorMap);
            const cls = m.placeholder ? " placeholder" : "";
            const iconsHtml = (m.icons && m.icons.length)
                ? `<div class="indicators-container">${m.icons.map(i => `<span class="indicator">${i}</span>`).join("")}</div>`
                : "";
            const w = m.ects > 0 ? m.ects * 26 : 100;
            return `
      <div class="modul${cls}" style="background:${bg}; width:${w}px; flex:0 0 ${w}px;" data-name="${m.name}" data-uni="${uni}">
        ${iconsHtml}
        <div class="modul-titel">${m.name}</div>
        <div class="modul-kp">${m.ects > 0 ? m.ects + " KP" : "Wahl"}</div>
      </div>`;
        }

        function renderUniRow(label, cssClass, modules, colorMap, uni) {
            if (!modules.length) return "";
            const modulesHtml = modules.map(m => renderModule(m, colorMap, uni)).join("");
            return `
    <div class="uni-row">
      <div class="uni-label ${cssClass}">${label}</div>
      <div class="uni-modules">${modulesHtml}</div>
    </div>`;
        }

        function renderSemester(semTitle, ethMods, zhawMods, ethCsMods, zhawCsMods) {
            return `
  <div class="vergleich-semester">
    <div class="vergleich-semester-titel">${semTitle}</div>
    ${renderUniRow("ETH Zürich<br>ITET", "eth", ethMods, ETH_COLORS, "eth")}
    ${renderUniRow("ZHAW<br>Elektrotechnik", "zhaw", zhawMods, ZHAW_COLORS, "zhaw")}
    ${renderUniRow("ETH Zürich<br>Informatik", "eth-cs", ethCsMods, ETH_CS_COLORS, "eth-cs")}
    ${renderUniRow("ZHAW<br>Informatik", "zhaw-cs", zhawCsMods, ZHAW_CS_COLORS, "zhaw-cs")}
  </div>`;
        }

        /* ================================================================
           RENDER MAIN
        ================================================================ */
        function filter(arr, y, hs) {
            return arr.filter(m => m.y === y && (hs === null ? m.hs === null : m.hs === hs));
        }

        const root = document.getElementById("vergleich-root");

        for (let yr = 1; yr <= 2; yr++) {
            let yearHtml = `<div class="vergleich-jahr"><div class="vergleich-jahr-titel">${yr}. Jahr</div>`;

            yearHtml += renderSemester(
                "Herbstsemester",
                filter(ETH, yr, true), filter(ZHAW, yr, true), filter(ETH_CS, yr, true), filter(ZHAW_CS, yr, true)
            );
            yearHtml += renderSemester(
                "Sommersemester",
                filter(ETH, yr, false), filter(ZHAW, yr, false), filter(ETH_CS, yr, false), filter(ZHAW_CS, yr, false)
            );

            yearHtml += `</div>`;
            root.innerHTML += yearHtml;
        }

        /* ================================================================
           TOOLTIP
        ================================================================ */
        const DETAIL_MAPS = { eth: ETH_DETAILS, zhaw: ZHAW_DETAILS, "eth-cs": ETH_CS_DETAILS, "zhaw-cs": ZHAW_CS_DETAILS };

        document.addEventListener("click", function (e) {
            const tooltipEl = document.getElementById("tooltip");
            const modul = e.target.closest(".modul");
            if (modul && !modul.classList.contains("placeholder")) {
                e.stopPropagation();
                showTooltip(modul, tooltipEl);
            } else if (e.target.closest("#tooltip")) {
                // keep open
            } else {
                if (tooltipEl) tooltipEl.style.display = "none";
            }
        });

        function showTooltip(moduleEl, tooltipEl) {
            if (!tooltipEl) return;
            const name = moduleEl.getAttribute("data-name");
            const uni = moduleEl.getAttribute("data-uni");
            const ectsStr = moduleEl.querySelector(".modul-kp")?.textContent || "";
            const details = (DETAIL_MAPS[uni] || {})[name];

            let html = `<div class="tooltip-close" onclick="document.getElementById('tooltip').style.display='none'">✕</div>`;
            html += `<h3>${name}</h3>`;
            if (ectsStr) html += `<div style="font-size:0.9em;color:#666;margin-bottom:8px;">${ectsStr}</div>`;

            if (details) {
                if (details.kurzbeschreibung) html += `<h4>Kurzbeschreibung</h4><p>${details.kurzbeschreibung}</p>`;
                if (details.inhalt) html += `<h4>Inhalte</h4><p style="white-space:pre-wrap;font-size:0.85em;line-height:1.3;">${details.inhalt}</p>`;
                const hasLinks = details.vorlesungslink || details.pruefungen || details.skript || details.link || details.kurslink;
                if (hasLinks) {
                    html += "<h4>Ressourcen</h4>";
                    if (details.vorlesungslink) html += `<p><a href="${details.vorlesungslink}" target="_blank">🎥 Vorlesungsvideos</a></p>`;
                    if (details.skript) html += `<p><a href="${details.skript}" target="_blank">📄 Skript</a></p>`;
                    if (details.pruefungen) html += `<p><a href="${details.pruefungen}" target="_blank">📝 Alte Prüfungen</a></p>`;
                    if (details.link) {
                        const links = Array.isArray(details.link) ? details.link : [details.link];
                        links.forEach(l => { html += `<p><a href="${l}" target="_blank">📖 VVZ / Modulseite</a></p>`; });
                    }
                    if (details.kurslink) {
                        details.kurslink.split("\n").filter(l => l.trim()).forEach(l => {
                            html += `<p><a href="${l.trim()}" target="_blank">📚 Kursunterlagen</a></p>`;
                        });
                    }
                }
            } else {
                html += `<p style="color:#999;font-size:0.9em;">Keine weiteren Details verfügbar</p>`;
            }

            tooltipEl.innerHTML = html;

            const rect = moduleEl.getBoundingClientRect();
            const TW = 340, PAD = 10;
            let left = rect.right + PAD;
            if (left + TW > window.innerWidth - PAD) left = rect.left - TW - PAD;
            if (left < PAD) left = PAD;
            const top = rect.top + window.scrollY;
            Object.assign(tooltipEl.style, { display: "block", left: left + "px", top: top + "px" });
        }
    </script>

    <div id="tooltip"></div>
</body>

</html>
